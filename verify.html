<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - Security Check</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="login-container verify-container">
        <form class="login-form" id="verifyForm">
            <div class="header">
                <div class="icon-header">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Verify Code</h1>
                <p>We've sent a verification code to<br><strong>your email address</strong></p>
            </div>

            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-field" placeholder="-" autofocus>
                <input type="text" maxlength="1" class="otp-field" placeholder="-">
                <input type="text" maxlength="1" class="otp-field" placeholder="-">
                <input type="text" maxlength="1" class="otp-field" placeholder="-">
            </div>

            <p class="resend-text">Didn't receive code? <span id="timer">00:30</span></p>
            <a href="#" class="resend-link disabled" id="resendLink">Resend Code</a>

            <button type="submit" class="submit-btn" id="verifyBtn">
                <span>Verify Identity</span>
                <div class="btn-bg"></div>
            </button>

            <div class="footer">
                <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
